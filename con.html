<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Contact Us | Skill2Earn Blog</title>
    <meta name="description" content="Contact Skill2Earn Blog for freelancing help, queries and collaboration.">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }
        header {
            background: #0a66c2;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #222;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #0a66c2;
        }
        .container {
            padding: 20px;
        }
        .contact-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            background: #0a66c2;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #084a96;
        }
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <p>We are here to help you 🤝</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="skills.html">Skills</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <div class="contact-box">
        <h2>📩 Send Message</h2>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <h3>📧 Email</h3>
        <p>skill2earn@gmail.com</p>

        <h3>📱 Follow Us</h3>
        <p>Instagram | YouTube | Telegram</p>
    </div>

</div>

<footer>
    <p>© 2026 Skill2Earn Blog | Contact Anytime 💬</p>
</footer>

</body>
</html>
